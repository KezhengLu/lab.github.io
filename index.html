<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV 多条件公开搜索表格</title>
    <style>
        /* 简单样式优化，提升可读性 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* 多搜索条件容器样式 */
        .search-container {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .search-item {
            margin-bottom: 1rem;
        }
        .search-item label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }
        #searchInput {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }
        .column-search {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .column-search input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }
        #searchInput:focus,
        .column-search input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.8rem 1rem;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .no-result {
            margin-top: 1rem;
            color: #666;
            font-size: 1rem;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <!-- 原有全局搜索框（保留，可选使用） -->
        <div class="search-item">
            <label>全局搜索（匹配所有列）</label>
            <input type="text" id="searchInput" placeholder="输入关键词搜索所有列内容...">
        </div>
        <!-- 新增列专属搜索框：名字 + 年龄（可根据你的CSV列名扩展） -->
        <div class="column-search">
            <div style="flex: 1; min-width: 200px;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: #333;">搜索名字</label>
                <input type="text" id="nameSearch" placeholder="输入姓名关键词...">
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: #333;">搜索年龄</label>
                <input type="text" id="ageSearch" placeholder="输入年龄（支持模糊匹配，如2开头）...">
            </div>
            <!-- 如需添加其他列搜索框，复制上面的div修改id和提示文字即可 -->
            <!-- 示例：搜索职业
            <div style="flex: 1; min-width: 200px;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: #333;">搜索职业</label>
                <input type="text" id="jobSearch" placeholder="输入职业关键词...">
            </div>
            -->
        </div>
    </div>

    <table id="csvTable">
        <thead id="tableHeader"></thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div id="noResult" class="no-result" style="display: none;">未找到匹配的内容</div>

    <!-- 引入 Papa Parse 库（CDN 方式，无需本地下载） -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script>
        // 1. 核心变量定义
        const csvFilePath = 'data.csv'; // 对应你的CSV文件名称
        let csvData = []; // 存储解析后的所有CSV数据
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const globalSearchInput = document.getElementById('searchInput'); // 全局搜索
        const nameSearchInput = document.getElementById('nameSearch'); // 名字搜索
        const ageSearchInput = document.getElementById('ageSearch'); // 年龄搜索
        // 如需其他列搜索，在这里定义对应的input变量，如：const jobSearchInput = document.getElementById('jobSearch');
        const noResult = document.getElementById('noResult');

        // 2. 加载并解析CSV文件
        function loadAndParseCSV() {
            // 使用Papa Parse加载远程CSV文件（GitHub Pages中为相对路径）
            Papa.parse(csvFilePath, {
                download: true, // 开启下载模式（支持远程/本地文件）
                header: true, // 将第一行作为表头（返回对象格式数据）
                complete: function (result) {
                    csvData = result.data; // 存储解析后的CSV数据
                    renderTable(csvData); // 渲染完整表格
                    console.log('CSV文件解析成功，共 ' + csvData.length + ' 条数据');
                },
                error: function (error) {
                    console.error('CSV文件解析失败：', error);
                    alert('加载CSV文件失败，请检查文件路径是否正确');
                }
            });
        }

        // 3. 渲染HTML表格
        function renderTable(data) {
            // 清空原有表格内容
            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';

            if (data.length === 0) {
                noResult.style.display = 'block';
                return;
            }
            noResult.style.display = 'none';

            // 渲染表头（从第一条数据中获取键作为表头）
            const headers = Object.keys(data[0]);
            const headerRow = document.createElement('tr');
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText;
                headerRow.appendChild(th);
            });
            tableHeader.appendChild(headerRow);

            // 渲染表格内容
            data.forEach(rowData => {
                const row = document.createElement('tr');
                headers.forEach(header => {
                    const td = document.createElement('td');
                    // 处理空值，避免显示undefined
                    td.textContent = rowData[header] || '';
                    row.appendChild(td);
                });
                tableBody.appendChild(row);
            });
        }

        // 4. 多条件组合搜索功能（核心：全局搜索 + 列专属搜索叠加筛选）
        function multiConditionSearch() {
            // 获取所有搜索框的关键词（转为小写并去除首尾空格）
            const globalKeyword = globalSearchInput.value.toLowerCase().trim();
            const nameKeyword = nameSearchInput.value.toLowerCase().trim();
            const ageKeyword = ageSearchInput.value.toLowerCase().trim();
            // 如需其他列搜索，获取对应关键词，如：const jobKeyword = jobSearchInput.value.toLowerCase().trim();

            // 第一步：筛选满足所有列专属搜索条件的数据
            let filteredData = [...csvData];
            // 筛选名字列
            if (nameKeyword) {
                filteredData = filteredData.filter(row => {
                    // 注意：这里的"姓名"要和你的CSV表头列名完全一致（大小写敏感），可修改为你的列名如"name"
                    const nameValue = String(row['姓名'] || row['name']).toLowerCase();
                    return nameValue.includes(nameKeyword);
                });
            }
            // 筛选年龄列
            if (ageKeyword) {
                filteredData = filteredData.filter(row => {
                    // 注意：这里的"年龄"要和你的CSV表头列名完全一致，可修改为你的列名如"age"
                    const ageValue = String(row['年龄'] || row['age']).toLowerCase();
                    return ageValue.includes(ageKeyword);
                });
            }
            // 如需添加其他列筛选，复制上面的逻辑，修改列名即可
            /* 示例：筛选职业列
            if (jobKeyword) {
                filteredData = filteredData.filter(row => {
                    const jobValue = String(row['职业'] || row['job']).toLowerCase();
                    return jobValue.includes(jobKeyword);
                });
            }
            */

            // 第二步：叠加全局搜索条件（如果有全局关键词）
            if (globalKeyword) {
                filteredData = filteredData.filter(row => {
                    return Object.values(row).some(value => {
                        return String(value).toLowerCase().includes(globalKeyword);
                    });
                });
            }

            // 渲染最终筛选后的表格
            renderTable(filteredData);
        }

        // 5. 绑定所有搜索框的输入事件（实时触发多条件搜索）
        function bindSearchEvents() {
            // 全局搜索框事件
            globalSearchInput.addEventListener('input', multiConditionSearch);
            // 名字搜索框事件
            nameSearchInput.addEventListener('input', multiConditionSearch);
            // 年龄搜索框事件
            ageSearchInput.addEventListener('input', multiConditionSearch);
            // 如需其他列搜索，绑定对应事件，如：jobSearchInput.addEventListener('input', multiConditionSearch);
        }

        // 6. 页面加载完成后，自动加载CSV并初始化
        window.addEventListener('DOMContentLoaded', function () {
            loadAndParseCSV();
            bindSearchEvents(); // 绑定所有搜索事件
        });
    </script>
</body>
</html>
