<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 光学器材查询 </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .csv-select-container {
            margin-bottom: 2rem;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .csv-select-container label {
            font-weight: bold;
            color: #333;
            margin-right: 1rem;
        }
        #csvFileSelector {
            padding: 0.6rem 1rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        #csvFileSelector:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }
        .search-container {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .search-item {
            margin-bottom: 1rem;
        }
        .search-item label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }
        #searchInput {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }
        .column-search {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-top: 1.5rem;
        }
        .column-search .search-col {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .column-search .search-col label {
            font-weight: 600;
            color: #2d3748;
            font-size: 0.95rem;
            margin: 0;
        }
        .column-search .search-col input {
            width: 100%;
            min-width: unset;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            outline: none;
            transition: all 0.2s ease;
        }
        #searchInput:focus,
        .column-search .search-col input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.8rem 1rem;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .no-result {
            margin-top: 1rem;
            color: #666;
            font-size: 1rem;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <!-- CSV文件选择器（关联光学元件/光机械件） -->
    <div class="csv-select-container">
        <label for="csvFileSelector">选择要加载的CSV文件：</label>
        <select id="csvFileSelector">
            <option value="data.csv" data-name="光学元件">光学元件（data.csv）</option>
            <option value="data1.csv" data-name="光机械件">光机械件（data1.csv）</option>
        </select>
    </div>

    <div class="search-container">
        <div class="search-item">
            <label>全局搜索（匹配产品型号/类型/材料等）</label>
            <input type="text" id="searchInput" placeholder="输入关键词搜索...">
        </div>
        <div class="column-search">
            <div class="search-col" id="modelWrap">
                <label>产品型号</label>
                <input type="text" id="modelSearch" placeholder="输入产品型号关键词...">
            </div>
            <div class="search-col" id="typeWrap">
                <label>产品类型</label>
                <input type="text" id="typeSearch" placeholder="输入产品类型关键词...">
            </div>
            <div class="search-col" id="paramWrap">
                <label>参数</label>
                <input type="text" id="paramSearch" placeholder="输入参数关键词...">
            </div>
            <div class="search-col" id="remarkWrap">
                <label>备注</label>
                <input type="text" id="remarkSearch" placeholder="输入备注关键词...">
            </div>
            <div class="search-col" id="materialWrap">
                <label>材料</label>
                <input type="text" id="materialSearch" placeholder="输入材料关键词...">
            </div>
            <div class="search-col" id="sizeWrap">
                <label>尺寸</label>
                <input type="text" id="sizeSearch" placeholder="输入尺寸关键词...">
            </div>
            <div class="search-col" id="coatingWrap">
                <label>镀膜</label>
                <input type="text" id="coatingSearch" placeholder="输入镀膜关键词...">
            </div>
        </div>
    </div>

    <table id="csvTable">
        <thead id="tableHeader"></thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div id="noResult" class="no-result" style="display: none;">未找到匹配的内容</div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script>
        // 1. 核心变量定义
        let csvFilePath = 'data.csv';
        let csvData = [];
        let currentCsvType = '光学元件';
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const globalSearchInput = document.getElementById('searchInput');
        const noResult = document.getElementById('noResult');
        const csvFileSelector = document.getElementById('csvFileSelector');
        const modelSearch = document.getElementById('modelSearch');
        const typeSearch = document.getElementById('typeSearch');
        const paramSearch = document.getElementById('paramSearch');
        const remarkSearch = document.getElementById('remarkSearch');
        const materialSearch = document.getElementById('materialSearch');
        const sizeSearch = document.getElementById('sizeSearch');
        const coatingSearch = document.getElementById('coatingSearch');
        const materialWrap = document.getElementById('materialWrap');
        const sizeWrap = document.getElementById('sizeWrap');
        const coatingWrap = document.getElementById('coatingWrap');
        const excludeGlobalSearchColumns = ['总数', '空余数量'];
        
        // 2. 加载并解析CSV文件
        function loadAndParseCSV(filePath, csvType) {
            currentCsvType = csvType;
            if (csvType === '光学元件') {
                materialWrap.style.display = 'block';
                sizeWrap.style.display = 'block';
                coatingWrap.style.display = 'block';
            } else if (csvType === '光机械件') {
                materialWrap.style.display = 'none';
                sizeWrap.style.display = 'none';
                coatingWrap.style.display = 'none';
            }

            Papa.parse(filePath, {
                download: true,
                header: true,
                complete: function (result) {
                    csvData = result.data;
                    renderTable(csvData);
                    clearAllSearchInputs();
                    console.log(`${filePath}（${csvType}）解析成功，共 ${csvData.length} 条数据`);
                },
                error: function (error) {
                    console.error(`${filePath} 解析失败：`, error);
                    alert(`加载 ${filePath} 失败，请检查文件路径是否正确`);
                }
            });
        }

        // 3. 清空所有搜索框输入
        function clearAllSearchInputs() {
            globalSearchInput.value = '';
            modelSearch.value = '';
            typeSearch.value = '';
            paramSearch.value = '';
            remarkSearch.value = '';
            materialSearch.value = '';
            sizeSearch.value = '';
            coatingSearch.value = '';
        }

        // 4. 渲染HTML表格
        function renderTable(data) {
            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';

            if (data.length === 0) {
                noResult.style.display = 'block';
                return;
            }
            noResult.style.display = 'none';

            // 渲染表头
            const headers = Object.keys(data[0]);
            const headerRow = document.createElement('tr');
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText;
                headerRow.appendChild(th);
            });
            tableHeader.appendChild(headerRow);

            // 渲染表格内容 
            data.forEach(rowData => {
                const row = document.createElement('tr');
                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.textContent = rowData[header] || '';
                    row.appendChild(td);
                });
                tableBody.appendChild(row);
            });
        }

        // 5. 多条件组合搜索
        function multiConditionSearch() {
            const globalKeyword = globalSearchInput.value.toLowerCase().trim();
            const modelKeyword = modelSearch.value.toLowerCase().trim();
            const typeKeyword = typeSearch.value.toLowerCase().trim();
            const paramKeyword = paramSearch.value.toLowerCase().trim();
            const remarkKeyword = remarkSearch.value.toLowerCase().trim();
            const materialKeyword = materialSearch.value.toLowerCase().trim();
            const sizeKeyword = sizeSearch.value.toLowerCase().trim();
            const coatingKeyword = coatingSearch.value.toLowerCase().trim();

            let filteredData = [...csvData];

            if (modelKeyword) {
                filteredData = filteredData.filter(row => {
                    const modelValue = String(row['产品型号'] || '').toLowerCase();
                    return modelValue.includes(modelKeyword);
                });
            }
            if (typeKeyword) {
                filteredData = filteredData.filter(row => {
                    const typeValue = String(row['产品类型'] || '').toLowerCase();
                    return typeValue.includes(typeKeyword);
                });
            }
            if (paramKeyword) {
                filteredData = filteredData.filter(row => {
                    const paramValue = String(row['参数'] || '').toLowerCase();
                    return paramValue.includes(paramKeyword);
                });
            }
            if (remarkKeyword) {
                filteredData = filteredData.filter(row => {
                    const remarkValue = String(row['备注'] || '').toLowerCase();
                    return remarkValue.includes(remarkKeyword);
                });
            }

            if (currentCsvType === '光学元件') {
                if (materialKeyword) {
                    filteredData = filteredData.filter(row => {
                        const materialValue = String(row['材料'] || '').toLowerCase();
                        return materialValue.includes(materialKeyword);
                    });
                }
                if (sizeKeyword) {
                    filteredData = filteredData.filter(row => {
                        const sizeValue = String(row['尺寸'] || '').toLowerCase();
                        return sizeValue.includes(sizeKeyword);
                    });
                }
                if (coatingKeyword) {
                    filteredData = filteredData.filter(row => {
                        const coatingValue = String(row['镀膜'] || '').toLowerCase();
                        return coatingValue.includes(coatingKeyword);
                    });
                }
            }

            if (globalKeyword) {
                filteredData = filteredData.filter(row => {
                    return Object.entries(row).some(([key, value]) => {
                        if (excludeGlobalSearchColumns.includes(key)) {
                            return false;
                        }
                        return String(value).toLowerCase().includes(globalKeyword);
                    });
                });
            }

            renderTable(filteredData);
        }

        // 6. 绑定所有事件
        function bindEvents() {
            csvFileSelector.addEventListener('change', function() {
                csvFilePath = this.value;
                const csvType = this.options[this.selectedIndex].dataset.name;
                loadAndParseCSV(csvFilePath, csvType);
            });

            globalSearchInput.addEventListener('input', multiConditionSearch);
            modelSearch.addEventListener('input', multiConditionSearch);
            typeSearch.addEventListener('input', multiConditionSearch);
            paramSearch.addEventListener('input', multiConditionSearch);
            remarkSearch.addEventListener('input', multiConditionSearch);
            materialSearch.addEventListener('input', multiConditionSearch);
            sizeSearch.addEventListener('input', multiConditionSearch);
            coatingSearch.addEventListener('input', multiConditionSearch);
        }

        // 7. 页面初始化
        window.addEventListener('DOMContentLoaded', function () {
            bindEvents();
            const initialCsvType = csvFileSelector.options[csvFileSelector.selectedIndex].dataset.name;
            loadAndParseCSV(csvFilePath, initialCsvType);
        });
    </script>
</body>
</html>
